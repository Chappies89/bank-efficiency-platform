[tool.coverage.run]
source = ["src/infrastructure/database"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
fail_under = 80
show_missing = true
