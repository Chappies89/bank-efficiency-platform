[run]
source = src
branch = True
omit =
    */tests/*
    */__init__.py
    */migrations/*
    */infrastructure/database/*
    */presentation/*
    */application/interfaces/*

[report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__:
    raise NotImplementedError
    @abstractmethod
    \.\.\.
    except Exception
fail_under = 85
show_missing = True
