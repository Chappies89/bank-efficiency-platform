[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/migrations/*",
    "*/infrastructure/database/*",
    "*/application/interfaces/*",
    "*/presentation/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
    "except Exception",
]
fail_under = 85
show_missing = true
