[project]
name = "bank-efficiency-platform"
version = "0.1.0"
description = "DEA-ML Hybrid platform for bank branch efficiency forecasting"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing"
markers = [
    "unit: Unit tests (Stage 1: Development)",
    "integration: Integration tests (Stage 2: Integration)",
    "e2e: End-to-end tests (Stage 3: System Verification)",
    "performance: Performance tests (Stage 3: System Verification)",
    "business: Business verification tests (Stage 4: Business Verification)",
    "smoke: Smoke tests (Stage 5: Production Release)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
