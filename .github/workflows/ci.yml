name: CI Pipeline

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]

jobs:
  stage-1-development:
    name: "Stage 1: Development (Unit Tests + Lint)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static code analysis (Ruff)
        run: ruff check src/ tests/

      - name: Type checking (MyPy)
        run: mypy src/

      - name: Run unit tests
        run: |
          pytest tests/unit/ -m unit -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  stage-2-integration:
    name: "Stage 2: Integration Tests"
    runs-on: ubuntu-24.04
    needs: stage-1-development

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bank_efficiency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://bankuser:bankpass@localhost:5432/bank_efficiency_test
        run: pytest tests/integration/ -m integration -v

  stage-3-system:
    name: "Stage 3: System Verification (Security Scan)"
    runs-on: ubuntu-24.04
    needs: stage-1-development   # ← Run in parallel with Stage 2

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable || true

      # E2E tests skipped until Stage 6 (US-022)
      - name: E2E tests (skipped until US-022)
        run: echo "E2E tests will be enabled in Stage 6 — US-022"

  stage-4-business:
    name: "Stage 4: Business Verification"
    runs-on: ubuntu-24.04
    needs: stage-1-development   # ← Run in parallel

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Business tests skipped until Stage 6 (US-023)
      - name: Business verification tests (skipped until US-023)
        run: echo "Business tests will be enabled in Stage 6 — US-023"

  stage-5-smoke:
    name: "Stage 5: Production Release (Smoke Tests)"
    runs-on: ubuntu-24.04
    needs: stage-1-development   # ← Run in parallel

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Smoke tests skipped until Stage 6 (US-024)
      - name: Smoke tests (skipped until US-024)
        run: echo "Smoke tests will be enabled in Stage 6 — US-024"

      - name: All stages completed
        run: echo "✅ CI pipeline completed successfully"
