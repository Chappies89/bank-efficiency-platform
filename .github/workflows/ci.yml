name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  stage-1-development:
    name: "Stage 1: Development (Unit Tests + Lint)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Static code analysis (Ruff)
        run: ruff check src/ tests/

      - name: Type checking (mypy)
        run: mypy src/

      - name: Run unit tests
        run: pytest tests/unit/ -m unit -v

  stage-2-integration:
    name: "Stage 2: Integration Tests"
    runs-on: ubuntu-latest
    needs: stage-1-development

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bank_efficiency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://bankuser:bankpass@localhost:5432/bank_efficiency_test
        run: pytest tests/integration/ -m integration -v

  stage-3-system:
    name: "Stage 3: System Verification (E2E + Security)"
    runs-on: ubuntu-latest
    needs: stage-2-integration

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bank_efficiency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security scan (Bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: postgresql://bankuser:bankpass@localhost:5432/bank_efficiency_test
        run: pytest tests/e2e/ -m e2e -v

  stage-4-business:
    name: "Stage 4: Business Verification"
    runs-on: ubuntu-latest
    needs: stage-3-system

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bank_efficiency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run business verification tests
        env:
          TEST_DATABASE_URL: postgresql://bankuser:bankpass@localhost:5432/bank_efficiency_test
        run: pytest tests/business/ -m business -v

  stage-5-smoke:
    name: "Stage 5: Production Release (Smoke Tests)"
    runs-on: ubuntu-latest
    needs: stage-4-business

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
          POSTGRES_DB: bank_efficiency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        env:
          TEST_DATABASE_URL: postgresql://bankuser:bankpass@localhost:5432/bank_efficiency_test
        run: pytest tests/smoke/ -m smoke -v

      - name: All stages passed
        run: echo "✅ All 5 stages passed. Ready for deployment."