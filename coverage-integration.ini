[run]
source =
    src/infrastructure/database
    src/presentation/api
    src/presentation/dashboard/data.py
branch = True
omit =
    */tests/*
    */__init__.py

[report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__:
    raise NotImplementedError
    @abstractmethod
    \.\.\.
fail_under = 70
show_missing = True
