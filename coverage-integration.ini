[pytest]
addopts = -v --strict-markers --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=70
markers =
    unit: Unit tests (Stage 1: Development)
    integration: Integration tests (Stage 2: Integration)
    e2e: End-to-end tests (Stage 3: System Verification)
    performance: Performance tests (Stage 3: System Verification)
    business: Business verification tests (Stage 4: Business Verification)
    smoke: Smoke tests (Stage 5: Production Release)

[run]
source = src
branch = True
omit =
    */tests/*
    */__init__.py
    */migrations/*
    */domain/*
    */config/*
    */infrastructure/ml/*
    */infrastructure/external/*
    */application/*

[report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__:
    raise NotImplementedError
    @abstractmethod
    \.\.\.
fail_under = 70
show_missing = True
